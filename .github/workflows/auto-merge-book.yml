name: 自动收录书籍

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write

jobs:
  merge-book:
    if: github.event.label.name == 'approved'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 解析 Issue 并写入 data.js
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
        run: |
          python3 scripts/merge_book.py

      - name: 提交变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.js
          git commit -m "feat: 自动收录书籍 #$ISSUE_NUMBER" || echo "No changes to commit"
          git push

      - name: 关闭 Issue 并评论
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --body "✅ 已自动收录到知识库！书籍数据已写入 data.js，网站将在几分钟内更新。感谢你的贡献！"
          gh issue edit ${{ github.event.issue.number }} --remove-label "approved" --add-label "merged"
          gh issue close ${{ github.event.issue.number }}
